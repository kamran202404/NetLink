<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NetLink — LAN P2P</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:        oklch(0.165 0.012 250);
      --bg-2:      oklch(0.195 0.012 250);
      --surface:   oklch(0.225 0.012 250);
      --surface-2: oklch(0.265 0.014 250);
      --line:      oklch(0.32  0.012 250);
      --line-soft: oklch(0.28  0.012 250);
      --text:      oklch(0.96  0.005 250);
      --text-dim:  oklch(0.74  0.010 250);
      --text-mute: oklch(0.58  0.010 250);
      --accent:    oklch(0.82  0.16  165);
      --accent-dim:oklch(0.42  0.10  165);
      --warn:      oklch(0.82  0.13   75);
      --danger:    oklch(0.68  0.19   25);

      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;height:100%;background:#0b0d10;color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
    body{overflow:hidden}
    button{font-family:inherit;color:inherit}
    ::selection{background:var(--accent-dim);color:var(--text)}

    /* Scrollbars */
    .scroll{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
    .scroll::-webkit-scrollbar{width:10px;height:10px}
    .scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;border:3px solid transparent;background-clip:content-box}
    .scroll::-webkit-scrollbar-thumb:hover{background:var(--line-soft);background-clip:content-box;border:3px solid transparent}

    /* App container — fills viewport, looks like a window */
    .app{
      position:fixed;inset:0;
      display:grid;
      grid-template-rows: 44px 1fr;
      background:var(--bg);
      color:var(--text);
      border-top:1px solid oklch(0.30 0.01 250);
    }

    /* Subtle stippled bg */
    .app::before{
      content:"";position:absolute;inset:0;pointer-events:none;
      background:
        radial-gradient(1200px 600px at 80% -10%, oklch(0.30 0.04 200 / 0.18), transparent 60%),
        radial-gradient(900px 500px at -10% 110%, oklch(0.30 0.04 165 / 0.10), transparent 60%);
      z-index:0;
    }
    .app > *{position:relative;z-index:1}

    /* ====== Top bar (window chrome + tabs) ====== */
    .topbar{
      display:grid;grid-template-columns: 110px 1fr auto;align-items:center;
      height:44px;padding:0 14px 0 14px;
      background:linear-gradient(180deg, oklch(0.22 0.012 250), oklch(0.20 0.012 250));
      border-bottom:1px solid var(--line);
      -webkit-app-region:drag;user-select:none;
    }
    .traffic{display:flex;gap:8px;align-items:center;padding-left:2px}
    .traffic i{width:12px;height:12px;border-radius:50%;display:block}
    .traffic i:nth-child(1){background:#ff5f57;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
    .traffic i:nth-child(2){background:#febc2e;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
    .traffic i:nth-child(3){background:#28c840;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}

    .tabs{display:flex;gap:2px;justify-self:center;-webkit-app-region:no-drag}
    .tab{
      display:flex;align-items:center;gap:8px;
      padding:6px 14px;border-radius:8px;
      font-size:13px;font-weight:500;color:var(--text-dim);
      background:transparent;border:1px solid transparent;cursor:default;
    }
    .tab:hover{background:oklch(0.24 0.012 250);color:var(--text)}
    .tab.active{background:oklch(0.28 0.014 250);color:var(--text);border-color:var(--line)}
    .tab .badge{
      min-width:18px;height:18px;padding:0 5px;border-radius:9px;
      font:500 10px/18px var(--mono);text-align:center;
      background:var(--accent);color:#0b0d10;
    }
    .tab.active .badge{background:var(--accent)}

    .topright{display:flex;align-items:center;gap:6px;-webkit-app-region:no-drag}
    .iconbtn{
      width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;
      border-radius:8px;border:1px solid transparent;background:transparent;color:var(--text-dim);
    }
    .iconbtn:hover{background:oklch(0.26 0.014 250);color:var(--text)}
    .iconbtn.active{background:oklch(0.28 0.016 250);color:var(--text);border-color:var(--line)}

    /* Connection pill */
    .net-pill{
      display:inline-flex;align-items:center;gap:8px;
      padding:5px 10px 5px 8px;border-radius:999px;
      background:oklch(0.26 0.014 250);border:1px solid var(--line);
      font:500 11px/1 var(--sans);color:var(--text-dim);
    }
    .net-pill .dot{
      width:7px;height:7px;border-radius:50%;background:var(--accent);
      box-shadow:0 0 0 0 var(--accent);
      animation:pulse 2.4s ease-out infinite;
    }
    @keyframes pulse{0%{box-shadow:0 0 0 0 oklch(0.82 0.16 165 / .55)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
    .net-pill code{font:500 11px/1 var(--mono);color:var(--text)}

    /* ====== Body grid ====== */
    .body{
      display:grid;
      grid-template-columns: 280px 1fr;
      min-height:0;
    }

    /* Toast */
    .toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:center}
    .toast{
      background:oklch(0.26 0.014 250);border:1px solid var(--line);
      padding:8px 14px;border-radius:10px;font-size:12.5px;color:var(--text);
      display:flex;align-items:center;gap:10px;
      box-shadow:0 10px 30px rgba(0,0,0,.4);
      animation:toastIn .25s ease-out;
    }
    @keyframes toastIn{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

    /* Modal */
    .modal-scrim{position:fixed;inset:0;background:rgba(8,10,12,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:9000;display:flex;align-items:center;justify-content:center;animation:fadeIn .15s ease-out}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    .modal{
      background:var(--surface);border:1px solid var(--line);border-radius:14px;
      width:min(520px, 92vw); padding:0; overflow:hidden;
      box-shadow:0 30px 80px rgba(0,0,0,.55);
      animation:modalIn .2s cubic-bezier(.2,.7,.2,1);
    }
    @keyframes modalIn{from{transform:translateY(8px) scale(.98);opacity:0}to{transform:none;opacity:1}}
    .modal h3{margin:0;font-size:14px;font-weight:600}

    /* Common */
    .row{display:flex;align-items:center;gap:10px}
    .col{display:flex;flex-direction:column}
    .mono{font-family:var(--mono)}
    .muted{color:var(--text-mute)}
    .dim{color:var(--text-dim)}
    .label-tiny{font:600 10px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--text-mute)}
    .divider{height:1px;background:var(--line-soft);margin:8px 0}

    /* Buttons */
    .btn{
      display:inline-flex;align-items:center;gap:8px;
      padding:7px 12px;border-radius:8px;font-size:12.5px;font-weight:500;
      background:oklch(0.27 0.014 250);border:1px solid var(--line);color:var(--text);
      cursor:default;
    }
    .btn:hover{background:oklch(0.30 0.014 250)}
    .btn.primary{background:var(--accent);color:#0b0d10;border-color:transparent;font-weight:600}
    .btn.primary:hover{filter:brightness(1.05)}
    .btn.danger{background:var(--danger);color:#fff;border-color:transparent}
    .btn.ghost{background:transparent}
    .btn.sm{padding:5px 10px;font-size:11.5px;border-radius:7px}

    /* Tooltips on icon buttons via title — keep simple */

    /* Avatar */
    .av{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font:600 12px/1 var(--sans);color:#0b0d10;flex-shrink:0;position:relative}
    .av.sm{width:26px;height:26px;font-size:10.5px}
    .av.lg{width:56px;height:56px;font-size:18px}
    .av .status{
      position:absolute;right:-1px;bottom:-1px;
      width:10px;height:10px;border-radius:50%;background:var(--accent);
      border:2px solid var(--bg);
    }
    .av .status.idle{background:var(--text-mute)}
    .av .status.busy{background:var(--warn)}
    .av .status.off{background:var(--text-mute)}

  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="sidebar.jsx"></script>
  <script type="text/babel" src="calls.jsx"></script>
  <script type="text/babel" src="chats.jsx"></script>
  <script type="text/babel" src="files.jsx"></script>
  <script type="text/babel" src="modals.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
